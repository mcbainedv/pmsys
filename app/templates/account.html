{% extends "base.html" %}
{% block title %}Account — PMSyS{% endblock %}
{% block content %}
<div class="page-head"><div><h1>My account</h1><div class="sub">Signed in as <strong>{{ user.username }}</strong></div></div></div>

<div class="card" style="max-width:520px">
  <h2>Change password</h2>
  <form method="post" action="/account/password">
    <div class="field" style="margin-bottom:12px">
      <label>Current password</label>
      <input type="password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>New password</label>
      <input type="password" name="new_password" autocomplete="new-password" required minlength="6">
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>Confirm new password</label>
      <input type="password" name="confirm_password" autocomplete="new-password" required minlength="6">
    </div>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
