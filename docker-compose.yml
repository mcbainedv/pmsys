services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-pmsys}
      MARIADB_USER: ${MARIADB_USER:-pmsys}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-pmsys_secret}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER:-pmsys}:${MARIADB_PASSWORD:-pmsys_secret}@db:3306/${MARIADB_DATABASE:-pmsys}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data: